<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Kavindu Chamith — building at the intersection of code, design, and data</title>
  <desc id="desc">A dark navy banner with cyan and violet gradients, orbital lines, and connected web, mobile, and data nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1222"/><stop offset="1" stop-color="#11102B"/></linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="1216" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEAD4"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#6366F1" stop-opacity="0.24"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94A3B8" opacity="0.13"/></pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
