    <text x="60" y="219" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Kavindu Chamith<tspan fill="#5EEAD4">.</tspan></text>
    <text x="64" y="264" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="21">Software Engineering Undergraduate</text>
    <text x="64" y="305" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Full-stack &amp; mobile development · Aspiring data engineer</text>
